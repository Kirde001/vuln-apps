include:
  - ./vuln-apps/CRLF-and-insecrure-file-upload-lab/docker-compose.yml

x-airflow-common:
  &airflow-common
  image: vulhub/airflow:1.10.10
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'true'
    AIRFLOW__API__AUTH_BACKEND: 'airflow.api.auth.backend.default'
  user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-50000}"
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  tomcat-lab:
    build: ./vuln-apps/HTTP-cookie-sandwich-lab
    ports:
      - "8083:8080"
    restart: unless-stopped

  alpine-httpd:
    image: httpd:alpine
    ports:
      - "4321:80"
    volumes:
      - ./apps/alpine-publisher/publisher.ro:/etc/usr/local/apache2/htdocs/publisher.ro
    restart: unless-stopped

  dvwa:
    image: vulnerables/web-dvwa
    ports:
      - "8082:80"
    environment:
      - PHP_OPTIONS=-d allow_url_include=On
    restart: unless-stopped

  bwapp:
    image: raesene/bwapp
    ports:
      - "1111:80"
    restart: unless-stopped

  openldap:
    image: osixia/openldap:latest
    ports:
      - "389:389"
    environment:
      - LDAP_ORGANISATION=Example Org
      - LDAP_DOMAIN=example.org
      - LDAP_ADMIN_PASSWORD=admin
    volumes:
      - ./ldap-init:/container/service/slapd/assets/config/bootstrap/ldif/custom
    restart: unless-stopped

  ldap-client:
    build: ./vuln-apps/LDAP-INJ-lab
    ports:
      - "2222:80"
    depends_on:
      - openldap
    restart: unless-stopped

  webgoat:
    image: webgoat/webgoat
    ports:
      - "8085:8080" 
      - "9090:9090"
    restart: unless-stopped

  juice-shop:
    image: bkimminich/juice-shop
    ports:
      - "3000:3000"
    restart: unless-stopped

  postgres:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  redis:
    image: redis:5-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-worker:
    <<: *airflow-common
    command: worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-init:
    <<: *airflow-common
    command: initdb
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'

  flower:
    <<: *airflow-common
    command: flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 10s
      timeout: 10s
      retries: 5